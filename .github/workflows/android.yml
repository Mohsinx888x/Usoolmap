name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'infra/**']
  pull_request:
    paths-ignore: ['backend/**', 'infra/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Optional repository secrets. Each one that is set is compiled into the APK; the app works
    # without any of them and reports the matching feature as not set up.
    env:
      VOICE_BACKEND_URL: ${{ secrets.VOICE_BACKEND_URL }}
      VOICE_BACKEND_APP_KEY: ${{ secrets.VOICE_BACKEND_APP_KEY }}
      MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UsoolMap-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release-bundle:
    # Builds the Play Store bundle. It is signed when the four RELEASE_* secrets exist, otherwise unsigned.
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    env:
      VOICE_BACKEND_URL: ${{ secrets.VOICE_BACKEND_URL }}
      VOICE_BACKEND_APP_KEY: ${{ secrets.VOICE_BACKEND_APP_KEY }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Release bundle (AAB)
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: UsoolMap-release-aab
          path: app/build/outputs/bundle/release/*.aab

