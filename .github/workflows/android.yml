name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'infra/**']
  pull_request:
    paths-ignore: ['backend/**', 'infra/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Optional repository secrets. Each one that is set is compiled into the APK; the app works
    # without any of them and reports the matching feature as not set up.
    env:
      VOICE_BACKEND_URL: ${{ secrets.VOICE_BACKEND_URL }}
      VOICE_BACKEND_APP_KEY: ${{ secrets.VOICE_BACKEND_APP_KEY }}
      MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UsoolMap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
